appId: io.github.charles2ke.opentrading
productName: OpenTrading
copyright: Copyright © OpenTrading contributors
directories:
  output: release
  buildResources: desktop/build
files:
  - dist/**
  - desktop/main.cjs
  - package.json
  - "!node_modules/**"
asar: true
npmRebuild: false
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: OpenTrading
mac:
  target:
    - dmg
    - zip
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  artifactName: ${productName}-${version}-${arch}.${ext}
