name: Nightly security

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-security
  cancel-in-progress: false

jobs:
  remediate-dependencies:
    name: Audit and remediate dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply safe dependency fixes
        run: npm audit fix --package-lock-only
      - run: npm ci
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Create remediation pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD -- package-lock.json; then
            exit 0
          fi
          branch="security/npm-audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package-lock.json
          git commit -m "fix: remediate npm audit findings"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::Remediation branch \`$branch\` already has an open pull request; it was updated with the latest lockfile."
            exit 0
          fi
          if gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "fix: remediate npm audit findings" \
            --body "Automated nightly dependency remediation. The workflow ran \`npm audit\`, linting, unit tests, and a production build." 2>"$RUNNER_TEMP/pr-create.log"; then
            exit 0
          fi
          cat "$RUNNER_TEMP/pr-create.log"
          if grep -q "not permitted to create or approve pull requests" "$RUNNER_TEMP/pr-create.log"; then
            echo "::warning::GitHub Actions is not allowed to open pull requests in this repository. Remediation branch \`$branch\` was pushed; open the pull request manually."
            {
              echo "## Dependency remediation"
              echo
              echo "Branch \`$branch\` was pushed, but GitHub Actions is not permitted to open pull requests."
              echo
              echo "[Open the pull request manually](${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$branch?expand=1)"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
