name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Package Windows installers (x64 and arm64)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --win --x64 --arm64 --publish never; then
              exit 0
            fi
            echo "electron-builder attempt ${attempt} failed"
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: opentrading-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Package macOS apps (x64 and arm64)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --mac --x64 --arm64 --publish never; then
              exit 0
            fi
            echo "electron-builder attempt ${attempt} failed"
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: opentrading-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opentrading-*
          merge-multiple: true
          path: release
      - name: Ensure release can receive assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json_file=""
          asset_ids_file=""
          cleanup() {
            rm -f "${release_json_file}" "${asset_ids_file}"
          }
          trap cleanup EXIT

          api_url="${GITHUB_API_URL:-https://api.github.com}"
          release_json_file="$(mktemp)"
          release_status="$(
            curl --silent --show-error --location \
              --write-out "%{http_code}" \
              --output "${release_json_file}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          )"
          if [ "${release_status}" = "404" ]; then
            exit 0
          fi
          if [ "${release_status}" != "200" ]; then
            cat "${release_json_file}" >&2
            exit 1
          fi

          release_json="$(cat "${release_json_file}")"
          if [ -z "${release_json}" ]; then
            exit 0
          fi

          is_draft="$(jq -r ".draft" <<<"${release_json}")"
          release_id="$(jq -r ".id" <<<"${release_json}")"
          release_url="$(jq -r ".html_url" <<<"${release_json}")"
          if [ "${is_draft}" != "true" ]; then
            echo "::error title=Release already published::${GITHUB_REF_NAME} already has a published release at ${release_url}. Published immutable releases cannot receive uploaded assets; delete that release and rerun this workflow, or let this workflow create and publish the release from a tag push."
            exit 1
          fi

          asset_ids_file="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq ".[].id" >"${asset_ids_file}"
          xargs -r -I {} -P 4 gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/{}" <"${asset_ids_file}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
