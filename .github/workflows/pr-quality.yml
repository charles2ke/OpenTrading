name: Pull request quality

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - id: screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots-${{ github.event.pull_request.number }}
          path: test-results/**/dashboard.png
          if-no-files-found: warn
      - name: Comment screenshot artifact
        if: always() && steps.screenshots.outputs.artifact-id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- opentrading-playwright-screenshots -->';
            const body = `${marker}\nPlaywright screenshots for desktop, Android, and iOS are available in [artifact #${{ steps.screenshots.outputs.artifact-id }}](${{ steps.screenshots.outputs.artifact-url }}).`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
